# ht_gravity_compensation 控制器配置（双臂 Panthera HT）
#
# 本文件为 controller_manager 与重力补偿控制器的完整参数。
# 启动入口：launch/gravity_compensation.launch.py（会按 type/hardware 覆盖 joints 等参数）。
#
# 参数文件解析规则（rcl_yaml_param_parser）：每一层键都是节点名的一部分，
# 支持通配符。顶层 /** 匹配任意深度的节点名前缀（正则 (/\\w+)*），
# 其下子键 controller_manager / gravity_compensation_controller 也是节点名：
#   /**/controller_manager             -> 匹配任意 namespace 下的 CM 节点
#   /**/gravity_compensation_controller-> 匹配任意 namespace 下的控制器节点
# 匹配成功后参数以裸名（无节点名前缀）注入节点，各自只读取自己关心的参数，
# 多余参数被忽略（CM 与控制器均允许未声明参数）。
# 注意：/*（单个星号）只匹配恰好一个路径 token——有 namespace 时可用
# （如 /drag_controller/controller_manager 匹配 /*/controller_manager），
# 但无 namespace 时（/controller_manager 仅 1 个 token）会匹配失败，
# 因此统一使用 /** 以兼容两种场景。
/**:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz，与描述包 dual.yaml 保持一致

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      gravity_compensation_controller:
        type: ht_gravity_compensation/GravityCompensationController
  gravity_compensation_controller:
    ros__parameters:
      # 重力补偿关节（12 个臂关节，URDF 顺序）
      joints:
        - left_joint1
        - left_joint2
        - left_joint3
        - left_joint4
        - left_joint5
        - left_joint6
        - right_joint1
        - right_joint2
        - right_joint3
        - right_joint4
        - right_joint5
        - right_joint6
      # 仅位置保持关节（夹爪平移关节，无电机力矩接口）
      hold_joints:
        - left_gripper_joint
        - right_gripper_joint
      # 力矩限幅（Nm），与 robot.xacro hardware 段 max_torques（每臂前 6 值）一致；留空则不限幅
      max_effort: [21.0, 36.0, 36.0, 21.0, 10.0, 10.0,
                  21.0, 36.0, 36.0, 21.0, 10.0, 10.0]
      # 世界系重力加速度（双臂 body_rpy 非零时需按安装方向旋转）
      gravity_vector: [0.0, 0.0, -9.81]
      # URDF 来源参数（controller_manager 注入 / /controller_manager 参数）
      urdf_param: robot_description
