# 本机 Hand2 网络配置（复制为 hand.local.conf 后修改，可选）
# cp config/hand.local.template.conf config/hand.local.conf
#
# quick_start 真机连接菜单（与本文件独立）：
#   使用上次仿真 — config/launch_last.conf 的 LAST_SIM_*（真机不会覆盖）
#   使用上次真机 — LAST_REAL_*（仿真不会覆盖）
#   单手：检验 / 扫描选择 / 启动时 scan / 手动输入
#   双手：检验 / 扫描选择 / 手动输入（禁止启动时 scan；须一左一右、两地址不同）
#   扫描列表按 SN 第 4 字符过滤左右（J=左 / K=右，与官方 SDK 一致）；无匹配时可「显示全部」
#   手动输入时：若本文件有 DEVICE_ADDRESS_LEFT/RIGHT，回车可采用为默认
#
# 出厂默认多为 192.168.1.110/111:50001；改过 IP 或端口时以扫描/检验结果为准
#（部分固件上报 :7447）。
#
# 勿与官方 SDK 双手套遥操（3.teleop_real_bimanual.py）同时连接同一对手。

DEVICE_ADDRESS_LEFT="192.168.1.110:50001"
DEVICE_ADDRESS_RIGHT="192.168.1.111:50001"
# SERIAL_NUMBER_LEFT=""
# SERIAL_NUMBER_RIGHT=""
