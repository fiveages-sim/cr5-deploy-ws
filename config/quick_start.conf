# quick_start 工作区配置（提交 git，bash 语法，由 quick_start.sh source）
# 参考：https://github.com/fiveages-sim/fa-deploy-ws (config/quick_start.conf)

# --- workspace / release（release.sh / 文档共用；打包保留子模块由此读取）---
RELEASE_WS_NAME="lift2s-ws"
RELEASE_GIT_BRANCH="main"
RELEASE_ROBOT_NAME="arx_lift2s"
RELEASE_SUBMODULE_PATHS=(
  "src/robot-descriptions-arx"
)

# --- navigation（Lift2S 固定基座：默认不显示导航菜单）---
ENABLE_NAVIGATION=0
NAV_ROBOT="arx_lift2s"
MAP_CONFIG_PKG=""
NAV_CONFIG_PKG=""

# --- launch entries（机型：x5 / r5 / acone / lift / lift2s / x7s）---
# declare -g -A：从 _load_quick_start_config 内 source 时需全局可见
# 已真机跑通：x5、acone、lift2s（分体/全身）；其余先按仿真/描述对齐
# lift / lift2s / x7s：启动后再选分体或全身（见 LAUNCH_ENTRY_BODY_MENU）
LAUNCH_ENTRY_IDS=(x5 r5 acone lift lift2s x7s)
declare -g -A LAUNCH_ENTRY_LABEL=(
  [x5]="单臂 X5 (arx5)"
  [r5]="单臂 R5 (arx5 type:=r5)"
  [acone]="双臂 ACone (arx_acone)"
  [lift]="Lift (arx_lift)"
  [lift2s]="Lift2S (arx_lift2s)"
  [x7s]="X7S (arx_x7s)"
)
# 无 BODY_MENU 时用此 launch；有 BODY_MENU 时由分体/全身覆盖
declare -g -A LAUNCH_ENTRY_LAUNCH=(
  [x5]="ocs2_arm_controller demo.launch.py"
  [r5]="ocs2_arm_controller demo.launch.py"
  [acone]="ocs2_arm_controller demo.launch.py"
  [lift]="ocs2_arm_controller demo.launch.py"
  [lift2s]="ocs2_arm_controller split_body.launch.py"
  [x7s]="ocs2_arm_controller demo.launch.py"
)
declare -g -A LAUNCH_ENTRY_BASE_ARGS=(
  [x5]="robot:=arx5"
  [r5]="robot:=arx5 type:=r5"
  [acone]="robot:=arx_acone"
  [lift]="robot:=arx_lift"
  [lift2s]="robot:=arx_lift2s"
  [x7s]="robot:=arx_x7s"
)
# 1=启动时再选分体 / 全身
declare -g -A LAUNCH_ENTRY_BODY_MENU=(
  [x5]=0
  [r5]=0
  [acone]=0
  [lift]=1
  [lift2s]=1
  [x7s]=1
)
# 1=启动时询问末端；ARX 当前描述固定夹爪，默认关
declare -g -A LAUNCH_ENTRY_EEF_MENU=(
  [x5]=0
  [r5]=0
  [acone]=0
  [lift]=0
  [lift2s]=0
  [x7s]=0
)

# --- end effectors（预留；当前 launch 未走 type:= 菜单时可忽略）---
EEF_NONE_KEY=none
EEF_ORDER=(none)
declare -g -A EEF=(
  [none]='空载/描述默认夹爪'
)
declare -g -A EEF_HAND_CONTROL_MODE=()
declare -g -A EEF_USB_ONLY_MODE=()
declare -g -A EEF_CANFD_MODE=()
declare -g -A EEF_CANFD_LEFT_ONLY=()

# --- build ---
# 完整源码：--packages-up-to（会编工作区内控制器栈）
# Lift2S：分体依赖 acone 描述；真机另含 arx_ros2_control
BUILD_LIFT2S_SIM_PACKAGES=(
  ocs2_arm_controller
  ocs2_wbc_controller
  topic_based_ros2_control
  arx_acone_description
  arx_lift2s_description
  arms_teleop
  adaptive_gripper_controller
  basic_joint_controller
)
BUILD_LIFT2S_REAL_PACKAGES=(
  arx_ros2_control
  ocs2_arm_controller
  ocs2_wbc_controller
  arx_acone_description
  arx_lift2s_description
  arms_teleop
  adaptive_gripper_controller
  basic_joint_controller
)
# 全机型仿真（x5 / r5 / acone / lift / lift2s / x7s）
BUILD_ALL_SIM_PACKAGES=(
  ocs2_arm_controller
  ocs2_wbc_controller
  topic_based_ros2_control
  arx5_description
  arx_acone_description
  arx_lift_description
  arx_lift2s_description
  arx_x7s_description
  arms_teleop
  adaptive_gripper_controller
  basic_joint_controller
)
# 发布包 / 已装 arms-full deb：只编 ARX 描述（HI 由 deb 提供；arms-standard 时真机另加 arx_ros2_control）
BUILD_DEB_LIFT2S_PACKAGES=(
  arx_acone_description
  arx_lift2s_description
)
BUILD_DEB_ALL_PACKAGES=(
  arx5_description
  arx_acone_description
  arx_lift_description
  arx_lift2s_description
  arx_x7s_description
)

# --- version query ---
VERSION_QUERY_MAIN_PACKAGES=(
  ocs2_arm_controller
  ocs2_wbc_controller
  basic_joint_controller
  arx_ros2_control
  arx5_description
  arx_acone_description
  arx_lift_description
  arx_lift2s_description
  arx_x7s_description
)
VERSION_QUERY_SECONDARY_PACKAGES=(
  arms_teleop
  arms_controller_common
  arms_target_manager
)
