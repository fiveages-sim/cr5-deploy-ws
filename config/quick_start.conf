# quick_start 工作区配置（bash 语法，由 quick_start.sh source）
# Wuji Hand2 精简工作空间（open-deploy-ws / feature/wujihand2）

RELEASE_WS_NAME="wuji_ws"
RELEASE_GIT_BRANCH="feature/wujihand2"

# Wuji C SDK：默认用仓内 external/wuji-sdk-c；以下为可选外部 tarball 探测顺序
# 也可 export WUJI_SDK_ROOT=/path/to/classic-tarball（调试覆盖）
WUJI_SDK_SEARCH_PATHS=(
  "${WUJI_SDK_ROOT:-}"
  "${HOME}/Documents/wuji/wuji-sdk-c-"*"-linux-gnu"
  "${HOME}/wuji-sdk-c-"*"-linux-gnu"
  "/opt/wuji/wuji-sdk-c-"*"-linux-gnu"
)

# 默认 Hand2 以太网地址（左/右；quick_start 输入 d 时使用；回车则 scan）
DEFAULT_DEVICE_ADDRESS_LEFT="192.168.1.110:50001"
DEFAULT_DEVICE_ADDRESS_RIGHT="192.168.1.111:50001"

# --- launch ---
# mock：共用 BJC hand.launch.py；真机：wujihand2_ros2_control 专用 launch（含 HI 参数）
LAUNCH_FILE_MOCK="basic_joint_controller hand.launch.py"
LAUNCH_BASE_ARGS_MOCK="hand:=wuji type:=hand2"
LAUNCH_FILE_REAL="wujihand2_ros2_control hand2.launch.py"
LAUNCH_BASE_ARGS_REAL=""

# --- build ---
# SDK 已 vendor 于 src/wujihand2-ros2-control/external/wuji-sdk-c（x86_64 + aarch64）
BUILD_SIM_PACKAGES=(
  wuji_description
  basic_joint_controller
  arms_rviz_control_plugin
  wujihand2_ros2_control
)
BUILD_REAL_PACKAGES=(
  wujihand2_ros2_control
  wuji_description
  basic_joint_controller
  arms_rviz_control_plugin
)

# --- version query ---
VERSION_QUERY_MAIN_PACKAGES=(
  wujihand2_ros2_control
  basic_joint_controller
  wuji_description
  robot_common_launch
  sensor_models
)
VERSION_QUERY_SECONDARY_PACKAGES=(
  hardware_interface
  controller_manager
  arms_controller_common
)
