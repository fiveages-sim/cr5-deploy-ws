# quick_start 工作区配置（提交 git，bash 语法，由 quick_start.sh source）
# 参考：https://github.com/fiveages-sim/fa-deploy-ws (config/quick_start.conf)

# --- workspace / release ---
RELEASE_WS_NAME="lift2s-ws"
RELEASE_GIT_BRANCH="main"
RELEASE_ROBOT_NAME="arx_lift2s"
RELEASE_SUBMODULE_PATHS=(
  "src/robot-descriptions-arx"
  "src/arx-ros2-control"
  "src/arms_ros2_control"
  "src/ocs2_ros2"
  "src/robot-descriptions-common"
)

# --- navigation（Lift2S 固定基座：默认不显示导航菜单）---
ENABLE_NAVIGATION=0
NAV_ROBOT="arx_lift2s"
MAP_CONFIG_PKG=""
NAV_CONFIG_PKG=""

# --- launch entries（单臂 / 双臂 / 分体 / 全身）---
# declare -g -A：从 _load_quick_start_config 内 source 时需全局可见
LAUNCH_ENTRY_IDS=(x5 dual split full)
declare -g -A LAUNCH_ENTRY_LABEL=(
  [x5]="单臂 X5 (arx5)"
  [dual]="双臂 ACone (arx_acone)"
  [split]="Lift2S 分体控制 (Split Body)"
  [full]="Lift2S 全身控制 (Full Body)"
)
declare -g -A LAUNCH_ENTRY_LAUNCH=(
  [x5]="ocs2_arm_controller demo.launch.py"
  [dual]="ocs2_arm_controller demo.launch.py"
  [split]="ocs2_arm_controller split_body.launch.py"
  [full]="ocs2_arm_controller full_body.launch.py"
)
declare -g -A LAUNCH_ENTRY_BASE_ARGS=(
  [x5]="robot:=arx5"
  [dual]="robot:=arx_acone"
  [split]="robot:=arx_lift2s"
  [full]="robot:=arx_lift2s"
)
# 1=启动时询问末端；ARX 当前描述固定夹爪，默认关
declare -g -A LAUNCH_ENTRY_EEF_MENU=(
  [x5]=0
  [dual]=0
  [split]=0
  [full]=0
)

# --- end effectors（预留；当前 launch 未走 type:= 菜单时可忽略）---
EEF_NONE_KEY=none
EEF_ORDER=(none)
declare -g -A EEF=(
  [none]='空载/描述默认夹爪'
)
declare -g -A EEF_HAND_CONTROL_MODE=()
declare -g -A EEF_USB_ONLY_MODE=()
declare -g -A EEF_CANFD_MODE=()
declare -g -A EEF_CANFD_LEFT_ONLY=()

# --- build ---
BUILD_SIM_PACKAGES=(
  arx5_description
  arx_acone_description
  arx_lift2s_description
  topic_based_ros2_control
  arms_teleop
)
BUILD_REAL_PACKAGES=(
  arx_ros2_control
  arx5_description
  arx_acone_description
  arx_lift2s_description
  arms_teleop
)
BUILD_DEB_PACKAGES=(
  arx_lift2s_description
)

# --- version query ---
VERSION_QUERY_MAIN_PACKAGES=(
  ocs2_arm_controller
  basic_joint_controller
  arx_ros2_control
  arx5_description
  arx_acone_description
  arx_lift2s_description
)
VERSION_QUERY_SECONDARY_PACKAGES=(
  arms_teleop
  arms_controller_common
  arms_target_manager
)
