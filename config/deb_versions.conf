# Lift2S 工作空间核心 deb 配置（与 quick_start.conf 同属 config/）
# 格式：包前缀|release tag|GitHub 仓库
# tag 填 latest 需 GitHub API（易触发 403 限流）；推荐固定 tag
# 安装顺序（勿调整）：ocs2 → common → arms_ros2_control-full
#
# 真机 HI（arx_ros2_control）由 arms-full deb 提供；发布包不保留 src/arx-ros2-control 源码。
# 开发 fallback：init_repo 可选 arms=standard 并源码 init arx-ros2-control。
#
# 发布通道（install_core_debs.sh / release.sh --release-channel）：
#   conf         — 使用下方固定 tag（当前打包默认）
#   latest       — 忽略下方固定 tag，改用各仓库 GitHub Latest 稳定版
#   pre-release  — 忽略下方固定 tag，改用各仓库 pre-release 浮动标签
#
ros-jazzy-ocs2|v1.3.0|legubiao/ocs2_ros2
ros-jazzy-robot-descriptions-common|v1.5.0|fiveages-sim/robot-descriptions-common
ros-jazzy-arms-ros2-control-full|v1.5.0|fiveages-sim/arms_ros2_control
