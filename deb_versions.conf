# 快速模式 deb 配置（修改后重新运行 init_repo.sh 选项 3/4 即可）
# 格式：包前缀|release tag|GitHub 仓库
# tag 留空或填 latest 表示自动使用 GitHub 最新 release；也可指定如 v0.1.3
# 安装顺序（勿调整）：ocs2 → common → arms_ros2_control
#
ros-jazzy-ocs2|latest|legubiao/ocs2_ros2
ros-jazzy-robot-descriptions-common|latest|fiveages-sim/robot-descriptions-common
ros-jazzy-arms-ros2-control|latest|fiveages-sim/arms_ros2_control
# ↑ 标准 WBC 包（ros-jazzy-arms-ros2-control），不含硬件驱动；驱动版为 ros-jazzy-arms-ros2-control-full
