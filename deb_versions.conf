# Lift2S 工作空间核心 deb 配置
# 格式：包前缀|release tag|GitHub 仓库
# tag 填 latest 需 GitHub API（易触发 403 限流）；推荐固定 tag
# 安装顺序（勿调整）：ocs2 → common → arms_ros2_control
#
# 真机 HI（arx_ros2_control）不在 arms deb 内，发布包保留 src/arx-ros2-control 源码。
# arms 使用 standard（不含 ht/marvin 等）；可用 install_core_debs.sh --arms-variant full 切换。
#
# 发布通道（install_core_debs.sh --channel）：
#   latest       — 忽略下方固定 tag，改用各仓库 GitHub Latest 稳定版
#   pre-release  — 忽略下方固定 tag，改用各仓库 pre-release 浮动标签
#   conf         — 使用下方固定 tag（本文件中的版本）
#
ros-jazzy-ocs2|v1.3.0|legubiao/ocs2_ros2
ros-jazzy-robot-descriptions-common|v1.5.0|fiveages-sim/robot-descriptions-common
ros-jazzy-arms-ros2-control|v1.5.0|fiveages-sim/arms_ros2_control
