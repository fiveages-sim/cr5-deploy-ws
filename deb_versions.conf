# HT 工作空间核心 deb 配置
# 格式：包前缀|release tag|GitHub 仓库
# tag 填 latest 需 GitHub API（易触发 403 限流）；推荐固定 tag
# 安装顺序（勿调整）：ocs2 → common → arms_ros2_control-full
#
# 本工作空间默认安装 arms-full（含 ht_ros2_control 等硬件驱动）。
# arms 选 deb 时由 init_repo.sh 自动清理 src/ht-ros2-control 源码。
#
# 发布通道（init_repo / install_core_debs.sh --channel）：
#   latest       — 忽略下方固定 tag，改用各仓库 GitHub Latest 稳定版
#   pre-release  — 忽略下方固定 tag，改用各仓库 pre-release 浮动标签
#   conf         — 使用下方固定 tag（本文件中的版本）
#
ros-jazzy-ocs2|v1.3.0|legubiao/ocs2_ros2
ros-jazzy-robot-descriptions-common|v1.4.0|fiveages-sim/robot-descriptions-common
ros-jazzy-arms-ros2-control-full|v1.5.0|fiveages-sim/arms_ros2_control
